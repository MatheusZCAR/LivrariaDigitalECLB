plugins {
    alias(libs.plugins.android.application)
}

// Assinatura de release opcional: crie um arquivo "keystore.properties" na raiz do projeto
// (ele está no .gitignore) com storeFile, storePassword, keyAlias e keyPassword.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.projeto.livrariadigitaleclb'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.projeto.livrariadigitaleclb"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Guarda o esquema do banco a cada versão, para escrever migrações com segurança.
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview

    // Banco de dados
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // Câmera (foto da capa) e leitor de código de barras
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    implementation libs.zxing.embedded
    implementation libs.zxing.core

    // Imagens das capas (carregamento leve, sem travar a lista)
    implementation libs.glide
    implementation libs.exifinterface

    // Backup no Google Drive
    implementation libs.work.runtime
    implementation libs.play.services.auth

    testImplementation libs.junit

    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.test.core
    androidTestImplementation libs.test.runner
    androidTestImplementation libs.test.rules
    androidTestImplementation libs.espresso.core
}
