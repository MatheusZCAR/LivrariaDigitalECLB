name: Android

on:
  push:
    branches: [master, melhorias-backup-drive]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compilar e testar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura (opcional)
        # Se o segredo DEBUG_KEYSTORE_BASE64 existir, o APK sai sempre assinado com a mesma
        # chave. Isso é necessário para o login do Google Drive funcionar no APK baixado
        # daqui (o SHA-1 cadastrado no Google Cloud precisa bater com o da chave).
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Usando keystore do segredo DEBUG_KEYSTORE_BASE64"
          fi

      - name: Compilar, testes unitários e lint
        run: |
          set -o pipefail
          mkdir -p ci-out
          ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace 2>&1 | tee ci-out/build.log

      - name: Assinatura do APK (SHA-1 para o Google Cloud)
        if: success()
        run: ./gradlew -q signingReport | grep -E "Variant|SHA1" | head -4

      - name: APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: livraria-eclb-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Relatórios (testes e lint)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-build
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/

      - name: "TEMP: publicar log do build na branch ci-resultados-build"
        if: always() && github.event_name != 'pull_request'
        run: |
          cp app/build/reports/lint-results-debug.txt ci-out/ 2>/dev/null || true
          cd ci-out
          git init -q
          git checkout -q -b ci-resultados-build
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Build de ${GITHUB_SHA}" || true
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-resultados-build

  emulador:
    name: Testes no ${{ matrix.aparelho }} (Android ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { aparelho: tablet, perfil: pixel_c, api: 28 }
          - { aparelho: tablet, perfil: pixel_c, api: 35 }
          - { aparelho: celular, perfil: pixel_5, api: 35 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compilar APKs de teste
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Rodar testes no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.perfil }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/testes-emulador.sh ${{ matrix.api }}

      - name: Screenshots e resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-${{ matrix.aparelho }}-android-${{ matrix.api }}
          path: ci-out/

      - name: "TEMP: publicar resultados na branch ci-resultados"
        if: always() && github.event_name != 'pull_request'
        run: |
          cd ci-out
          git init -q
          git checkout -q -b ci-resultados-${{ matrix.aparelho }}${{ matrix.api }}
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Resultados de ${GITHUB_SHA}" || true
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-resultados-${{ matrix.aparelho }}${{ matrix.api }}
