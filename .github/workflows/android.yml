name: Android

on:
  push:
    branches: [master, melhorias-backup-drive]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e testar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura (opcional)
        # Se o segredo DEBUG_KEYSTORE_BASE64 existir, o APK sai assinado sempre com a
        # mesma chave. Isso é necessário para o login do Google Drive funcionar no APK
        # baixado daqui (o SHA-1 cadastrado no Google Cloud precisa bater).
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Usando keystore do segredo DEBUG_KEYSTORE_BASE64"
          fi

      - name: Compilar, testes unitários e lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: livraria-eclb-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Relatórios (testes e lint)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-build
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
